name: CI/CD Pipeline - Build, Push to ECR & Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'agentpress' }}
  CONTAINER_NAME: agentpress
  HOST_PORT: 8001  # Avoids collision with existing app running on port 80/8000

jobs:
  build-and-deploy:
    name: Build, Push to ECR, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR Auth Token for Remote Host
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Build, Tag, and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Existing EC2 Instance via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_TOKEN: ${{ steps.ecr-token.outputs.token }}
          ECR_REPO: ${{ env.ECR_REPOSITORY }}
          CONTAINER: ${{ env.CONTAINER_NAME }}
          PORT: ${{ env.HOST_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_TOKEN,ECR_REPO,CONTAINER,PORT
          script: |
            set -e
            echo "==> Authenticating Docker to Amazon ECR on EC2 (no AWS CLI needed)..."
            echo "$ECR_TOKEN" | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "==> Stopping prior AgentPress container to release memory and ports..."
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true

            echo "==> Freeing disk space before pulling new image..."
            docker system prune -f || true
            docker image prune -af || true

            echo "==> Pulling latest AgentPress image..."
            docker pull $ECR_REGISTRY/$ECR_REPO:latest

            echo "==> Ensuring persistent volume directories and env file exist on host..."
            mkdir -p ~/agentpress-data/images ~/agentpress-data/outputs
            touch ~/agentpress.env

            echo "==> Running new AgentPress container on port $PORT..."
            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p $PORT:8000 \
              --env-file ~/agentpress.env \
              -v ~/agentpress-data/images:/app/images \
              -v ~/agentpress-data/outputs:/app/outputs \
              $ECR_REGISTRY/$ECR_REPO:latest

            echo "==> Pruning dangling images..."
            docker image prune -f

            echo "==> AgentPress deployed successfully on port $PORT!"
